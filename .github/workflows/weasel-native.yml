name: Build Jev Weasel
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'lua/**'
      - 'bridge.mjs'
      - 'context-pebrel.mjs'
      - 'provider*.mjs'
      - 'rime_ice_jev.schema.yaml'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/weasel-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare pinned upstream
        run: python scripts/Prepare-Weasel.py
      - uses: actions/cache@v4
        with:
          path: upstream/weasel/deps/boost_1_84_0
          key: boost-1.84-msvc143-x64-mt-static-v1
      - name: Build native components
        shell: pwsh
        run: ./scripts/Build-Weasel.ps1
      - name: Native context tests
        shell: pwsh
        run: ./scripts/Test-NativeContext.ps1
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Packaging tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Stage matched bundle
        run: python scripts/Package-Native.py --artifact . --output runtime/native-bundle --source-label "github:${{ github.repository }}/actions/runs/${{ github.run_id }}@${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: weasel-jev-x64-bundle
          path: runtime/native-bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: weasel-jev-x64-experimental
          path: |
            upstream/weasel/output/WeaselServer.exe
            upstream/weasel/output/weaselx64.dll
            native/weasel-jev.patch
            native/LICENSE-GPL-3.0.txt
            native/README.md
            native/include/
            native/CONTEXT.md
            lua/jev_windows.lua
          if-no-files-found: error
